<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Industries - Sign in</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #e8e8e8; margin: 0; }
  .box { width: 300px; margin: 100px auto 0; background: #fff; border: 1px solid #bbb; padding: 20px 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #777; font-size: 12px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; margin: 10px 0 3px; }
  input { width: 100%; padding: 6px; border: 1px solid #aaa; box-sizing: border-box; font-size: 13px; }
  button { margin-top: 14px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
  #msg { color: #b00; font-size: 12px; margin-top: 10px; min-height: 14px; }
  .foot { text-align: center; color: #999; font-size: 11px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Ghost Industries</h1>
    <div class="sub">Employee portal - sign in</div>
    <form id="f" method="post">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="off">
      <label for="p">Password</label>
      <input id="p" name="password" type="password">
      <button type="submit">Sign in</button>
    </form>
    <div id="msg"></div>
  </div>
  <div class="foot">internal use only &middot; problems? call the IT desk</div>
<script>
document.getElementById('f').onsubmit = function (e) {
  e.preventDefault();
  var body = new FormData(e.target);
  fetch('/api/login', { method: 'POST', body: body }).then(function (r) {
    if (r.ok) { location.reload(); return null; }
    return r.json();
  }).then(function (d) {
    if (d) document.getElementById('msg').textContent = d.error || 'login failed';
  });
};
</script>
</body>
</html>
