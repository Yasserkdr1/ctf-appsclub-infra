services:
  stream:
    build: .
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      FLAG: "bwctf{local_test_only}"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777,size=67108864
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
