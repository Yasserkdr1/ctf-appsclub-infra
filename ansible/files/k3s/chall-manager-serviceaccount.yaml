apiVersion: v1
kind: Namespace
metadata:
  name: ctf-system
  labels:
    purpose: ctf-management
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chall-manager
  namespace: ctf-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ctf-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
