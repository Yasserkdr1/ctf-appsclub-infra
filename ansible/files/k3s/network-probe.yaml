apiVersion: v1
kind: Namespace
metadata:
  name: ctf-probe
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-http
  namespace: ctf-probe
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - echo OK > /www/index.html && exec httpd -f -p 8080 -h /www
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      volumeMounts:
        - name: www
          mountPath: /www
  volumes:
    - name: www
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-client
  namespace: ctf-probe
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
