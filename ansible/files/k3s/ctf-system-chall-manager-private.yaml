apiVersion: v1
kind: Service
metadata:
  name: chall-manager-private
  namespace: ctf-system
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: chall-manager
    ctfer.io/stack-name: test
  ports:
    - name: grpc
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 31080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-to-chall-manager
  namespace: ctf-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chall-manager
      ctfer.io/stack-name: test
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.60.1.10/32
      ports:
        - protocol: TCP
          port: 8080
