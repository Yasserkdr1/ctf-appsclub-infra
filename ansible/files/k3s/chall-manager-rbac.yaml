apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chall-manager-pods
  namespace: ctf-test
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      - get
      - list
      - watch
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chall-manager-pods
  namespace: ctf-test
subjects:
  - kind: ServiceAccount
    name: chall-manager
    namespace: ctf-system
roleRef:
  kind: Role
  name: chall-manager-pods
  apiGroup: rbac.authorization.k8s.io
