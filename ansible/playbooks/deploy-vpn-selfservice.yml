---
# Install broker and mount credentials before installing CTFd plugin.
# No existing VPN peers are removed; the reconcile timer is opt-in.
- name: Install secure AppsClub VPN self-service broker on gateway
  hosts: ctfd
  become: true
  gather_facts: false
  tasks:
    - name: Ensure broker private directory
      ansible.builtin.file:
        path: /etc/appsclub-vpn
        state: directory
        owner: root
        group: "1001"
        mode: "0750"

    - name: Generate one shared local broker secret if missing
      ansible.builtin.shell: |
        umask 077
        /usr/bin/python3 -c 'import secrets; print(secrets.token_urlsafe(48))' > /etc/appsclub-vpn/broker.token
      args:
        creates: /etc/appsclub-vpn/broker.token
      no_log: true

    - name: Allow only container UID/GID 1001 to read broker credential
      ansible.builtin.file:
        path: /etc/appsclub-vpn/broker.token
        owner: root
        group: "1001"
        mode: "0440"

    - name: Persist dynamic peer metadata privately
      ansible.builtin.file:
        path: /var/lib/appsclub-vpn
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Ensure dynamic VIP registry parent exists
      ansible.builtin.file:
        path: /var/lib/appsclub-vip
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install gateway-only broker
      ansible.builtin.copy:
        src: ../files/appsclub_vpn_broker.py
        dest: /usr/local/libexec/appsclub-vpn-broker.py
        owner: root
        group: root
        mode: "0700"

    - name: Install broker systemd unit
      ansible.builtin.template:
        src: ../templates/appsclub-vpn-broker.service.j2
        dest: /etc/systemd/system/appsclub-vpn-broker.service
        owner: root
        group: root
        mode: "0644"

    - name: Install membership reconciliation unit
      ansible.builtin.template:
        src: ../templates/appsclub-vpn-reconcile.service.j2
        dest: /etc/systemd/system/appsclub-vpn-reconcile.service
        owner: root
        group: root
        mode: "0644"

    - name: Install membership reconciliation timer
      ansible.builtin.template:
        src: ../templates/appsclub-vpn-reconcile.timer.j2
        dest: /etc/systemd/system/appsclub-vpn-reconcile.timer
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd after installing broker
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable local broker
      ansible.builtin.systemd_service:
        name: appsclub-vpn-broker.service
        enabled: true
        state: restarted

    - name: Enable membership sync only after CTFd plugin is verified
      ansible.builtin.systemd_service:
        name: appsclub-vpn-reconcile.timer
        enabled: true
        state: started
      when: vpn_enable_reconcile | default(false) | bool
